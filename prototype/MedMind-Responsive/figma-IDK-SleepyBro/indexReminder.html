:root{--bg:#F5F7F2;--surface:#FFFEF8;--surface-raised:#EDF2E8;--primary:#164C3B;--on-primary:#FFFEF8;--text:#18382F;--muted:#54675D;--border:#D8E1D4;--accent:#D8F36A;--accent-text:#18382F;--success:#1F653E;--success-bg:#EDF5E9;--danger:#9B352B;--danger-bg:#FCEAE5;--amber:#785012;--amber-bg:#FFF1D8;--hero:#A6C978;--hero-text:#18382F;--peach:#F2C9A0;--shadow:0 12px 36px #18382F0D;--radius-card:26px;--radius-button:32px;--gap:16px;--body-size:18px;--outer:#E9EDE4;font-family:Sarabun,sans-serif;color:var(--text);font-size:18px;font-weight:400;line-height:1.55}
*{box-sizing:border-box}body{margin:0;background:var(--outer)}button,input,select{font:inherit;color:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:4px}button{border:0}h1,h2,h3,p{margin:0}button .mm-icon{flex:none}a{color:inherit;text-decoration:none}.mm-icon{flex-shrink:0;display:inline-block;vertical-align:middle}.dark,[data-theme=Dark]{--bg:#111A16;--surface:#1A2922;--surface-raised:#22372B;--primary:#CBEA69;--on-primary:#14291D;--text:#E5EEE8;--muted:#BDCCC2;--border:#405248;--accent:#CBEA69;--accent-text:#14291D;--success:#6FCF97;--success-bg:#203B2C;--danger:#FF8A80;--danger-bg:#3B2925;--amber:#FFC266;--amber-bg:#3A3021;--hero:#354C2A;--hero-text:#E5EEE8;--shadow:none;--outer:#17231C}.dark .mascot,[data-theme=Dark] .mascot{filter:brightness(.85) saturate(.85)}

</script><script>/* MedMind editable capture views. Copy and medicine-label data: medmind-copy.json.

 */
(function () {
  'use strict';

  const KEYS = ['splash','role','senior-pair','caregiver-pair','senior-connected','caregiver-connected','meal-setup','senior-home','reminder','confirmed','duplicate','senior-settings','senior-unpair','caregiver-status','notifications','medicines','medicine-edit','photo-guide','camera','ocr-reading','draft','manual','medicine-time','saved','caregiver-settings','caregiver-unpair'];
  let lang = 'th';

  const choose = (th, en) => lang === 'th' ? th : en;
  const icon = (name, size = 22) => window.MMIcon ? window.MMIcon(name, size) : '';
  const mascot = (pose = 'greeting', size = 116) => window.MMMascot ? window.MMMascot(pose, size) : '';
  const copy = () => window.MMCopy;
  const common = () => copy().shared[lang];
  const medicine = () => copy().sourceData.medicine;
  const current = () => copy().screens.find(item => item.key === screenKey)[lang];
  const runtime = () => window.MMRuntime || {};
  const inviteCode = () => String(runtime().invite || '406218');
  const status = fallback => options.forcedStatus || (runtime().confirmed ? (runtime().late ? 'late' : 'success') : runtime().lateWindowClosed ? 'closed' : runtime().unconfirmed ? 'danger' : fallback);
  const isConfirmed = () => ['success','late'].includes(status('due'));
  const confirmedAt = () => options.confirmedAt || runtime().confirmedAt || (status('due') === 'late' ? '07:17' : '07:02');
  const reminderRound = () => Math.max(1,Math.min(3,Number(options.round || runtime().round || 1)));
  const fill = text => String(text || '').replace(/\{\{(\w+)\}\}/g, (_, name) => ({seniorName: choose('คุณสมพร','Somphon'), remaining:'09:42', mealName:choose('มื้อเช้า','Breakfast'), time:'07:00', confirmedAt:confirmedAt(), lateUntil:'23:59', round:String(reminderRound()), confirmed:isConfirmed() ? '1' : '0', total:'1', count:'1', progress:'64'}[name] || ''));
  const t = key => common()[key] || key;
  const date = () => choose('อาทิตย์ 25 ตุลาคม 2569','Sunday, 25 October 2026');
  const attrs = data => Object.entries(data || {}).map(([name, value]) => value == null ? '' : ` ${name}="${esc(value)}"`).join('');
  const button = (label, go, style = 'primary', symbol = 'arrow-right', extra = {}) => `<button class="button button-${style}" type="button"${attrs({'data-go':go,...extra})}>${symbol ? icon(symbol,22) : ''}<span>${esc(fill(label))}</span></button>`;
  const smallLink = (label, go, symbol = 'chevron-right') => `<button class="button-link" type="button" data-go="${esc(go)}"><span>${esc(label)}</span>${icon(symbol,20)}</button>`;
  const pill = (label, type = '', symbol = '') => `<span class="pill ${type}">${symbol ? icon(symbol,18) : ''}<span>${esc(fill(label))}</span></span>`;
  const notice = (body, type = '', symbol = 'info') => `<div class="notice${type ? ` notice-${type}` : ''}">${icon(symbol,22)}<span>${esc(fill(body))}</span></div>`;
  const intro = (title, subtitle, kicker = '') => `<div class="stack" style="gap:8px">${kicker ? `<div class="kicker">${esc(kicker)}</div>` : ''}<h1 class="title">${esc(fill(title))}</h1>${subtitle ? `<p class="subtitle">${esc(fill(subtitle))}</p>` : ''}</div>`;
  const privacy = () => `<p class="subtitle" style="font-size:18px;margin-top:12px">${esc(t('medicalNotice'))}</p>`;
  const stepper = active => `<div class="stepper" aria-label="${esc(choose('ขั้นตอนการเพิ่มยา','Add medicine steps'))}">${[choose('ฉลาก','Label'),choose('ตรวจร่าง','Review'),choose('เวลา','Timing')].map((label,index) => `<span class="${index === active ? 'selected' : ''}">${index < active ? icon('check',18) : `<b>${index + 1}</b>`}<span>${label}</span></span>`).join('')}</div>`;

  function top(role = 'senior', back = '', right = '') {
    return `<header class="screen-top">${back ? `<button class="button-link" type="button" data-go="${esc(back)}">${icon('chevron-left',22)}<span>${esc(t('back'))}</span></button>` : `<div class="brand">${icon('leaf',26)}<span>MedMind</span></div>`}${right || `<span class="role-badge">${esc(role === 'caregiver' ? choose('ผู้ดูแล','Caregiver') : choose('ผู้สูงอายุ','Senior'))}</span>`}</header>`;

  function nav(role, active) {

    return `<nav class="bottom-nav" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))" aria-label="${esc(choose('เมนูหลัก','Main navigation'))}">${items.map(([go,name,label],index) => `<button type="button" class="nav-item ${index === (role === 'caregiver' ? 2 : 1) ? 'nav-center' : ''} ${active === go ? 'selected' : ''}" data-go="${go}"${active === go ? ' aria-current="page"' : ''}>${icon(name,24)}<span>${label}</span></button>`).join('')}</nav>`;
  }

  function layout(content, role = 'senior', active = '', back = '', config = {}) {
    return `${config.noTop ? '' : top(role,back,config.right || '')}<main class="screen-scroll${config.scrollClass ? ` ${config.scrollClass}` : ''}"${attrs(config.mainAttrs)}>${content}</main>${config.noNav ? '' : nav(role,active || (role === 'caregiver' ? 'caregiver-status' : 'senior-home'))}`;
  }

  function field(label, value = '', config = {}) {
    const fieldId = config.id || label.replace(/[^a-zA-Z0-9]/g,'') || `mm-field-${Math.random().toString(36).slice(2,8)}`;
    const empty = config.empty;
    return `<label class="field${config.error ? ' field-error' : ''}" for="${fieldId}"><span class="field-label">${esc(label)}${config.required ? ` <span aria-label="${esc(t('required'))}">*</span>` : ''}</span>${config.multiline ? `<textarea class="input" id="${fieldId}" rows="2"${config.readonly ? ' readonly' : ''}${attrs(config.attrs)}>${empty ? '' : esc(value)}</textarea>` : `<input class="input" id="${fieldId}" type="${config.type || 'text'}" value="${empty ? '' : esc(value)}"${config.placeholder ? ` placeholder="${esc(config.placeholder)}"` : ''}${config.readonly ? ' readonly' : ''}${config.required ? ' required' : ''}${attrs(config.attrs)}>`}${config.error ? `<span>${icon('alert-circle',18)} ${esc(t('reviewRequired'))}</span>` : ''}</label>`;
  }

  function mealCard(status = 'due', action = true) {
    const m = medicine();
    const definitions = {
      due: ['status-due',t('due'),'clock'],
      upcoming: ['status-amber',t('upcoming'),'clock'],

      late: ['status-success',`${t('late')} · ${confirmedAt()}`,'check-check'],

    const [stateClass,statusText,symbol] = definitions[status] || definitions.due;
    return `<article class="meal-card ${stateClass}"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px"><div><div class="kicker">${choose('มื้อเช้า','Breakfast')}</div><strong style="font-size:28px;line-height:1.5">07:00</strong></div>${pill(statusText,stateClass,symbol)}</div><div class="divider"></div><strong style="font-size:20px;line-height:1.5;display:block">${esc(m.name)}</strong><p class="subtitle" style="margin:4px 0 0">${esc(m.displayDose)} · ${esc(m.timingLabel)}</p>${action && (status === 'due' || status === 'danger') ? `<div style="margin-top:16px">${button(t('takenAction'),'confirmed','primary','check',{'data-confirm-meal':'morning',style:'min-height:64px'})}</div>` : ''}${status === 'late' ? `<p class="subtitle" style="margin:12px 0 0">${choose('ยืนยันเวลา','Confirmed at')} ${esc(confirmedAt())}</p>` : ''}</article>`;
  }

  function medicineFields({empty = false, uncertain = false} = {}) {
    const m = medicine();
    return `<div class="stack" style="gap:18px">${field(t('medicineName'),m.name,{id:'medicine-name',required:true,empty:empty || uncertain,error:uncertain,attrs:uncertain ? {'data-review-field':'medicine-name','aria-invalid':'true'} : {}})}${field(t('pillsPerDose'),m.pillsPerDose,{id:'medicine-pills',required:true,type:'number',empty})}${field(t('labelTiming'),m.timingLabel,{id:'medicine-label-timing',required:true,empty})}${field(t('caution'),m.caution,{id:'medicine-caution',multiline:true,empty})}${field(t('contraindication'),'',{id:'medicine-contraindication',multiline:true,placeholder:choose('กรอกเฉพาะข้อความที่ฉลากระบุ','Enter only what the label states')})}</div>`;
  }

  function sourceLabel(compact = false) {
    const m = medicine();
    return `<div class="photo-label" style="padding:${compact ? '18px' : '24px'};text-align:left;transform:rotate(-2deg)"><div class="kicker">${choose('ฉลากตัวอย่างสมมติ','Fictional sample label')}</div><strong style="font-size:${compact ? '19px' : '22px'};display:block;line-height:1.5;margin:12px 0 8px">${esc(m.name)}</strong><p style="margin:0;font-size:18px;line-height:1.6">${esc(m.doseInstruction)}<br>${esc(m.timingLabel)}</p><div class="divider"></div><p style="font-size:18px;line-height:1.6;margin:0">คำเตือน: ${esc(m.caution)}</p></div>`;

    let markup = icon('qr-code',168);
    if (typeof window.qrcode === 'function') {
      const code = window.qrcode(0,'M');

  }

  function successScreen(kind = 'confirmed') {

    const caregiver = ['caregiver-connected','saved'].includes(kind);

    const title = c.title;
    const content = `<div class="stack" style="align-items:center;text-align:center;gap:22px;padding-top:28px"><div class="mascot-wrap">${mascot(kind.includes('connected') ? 'greeting' : 'celebrate',172)}</div>${pill(kind.includes('connected') ? choose('เชื่อมต่อแล้ว','Connected') : choose('บันทึกสำเร็จ','Saved'),'status-success','check-circle')}${intro(title,c.subtitle)}${kind === 'confirmed' ? `<div class="card" style="width:100%;text-align:left"><div class="row" style="justify-content:space-between"><span>${choose('มื้อเช้า','Breakfast')}</span><strong>07:00</strong></div><div class="divider"></div>${pill((status('success') === 'late' ? t('late') : t('taken')) + choose(' · ยืนยัน ',' · Confirmed ') + confirmedAt(),'status-success','check-circle')}</div>` : ''}${c.mascot ? `<p class="subtitle" style="font-size:20px">${esc(c.mascot)}</p>` : ''}<div class="stack" style="width:100%;gap:12px">${button(c.primary,go,'primary',kind === 'caregiver-connected' ? 'clock' : 'check')}${kind === 'saved' ? button(c.secondary,'photo-guide','secondary','plus') : ''}</div>${kind === 'confirmed' ? `<p class="subtitle">${esc(t('selfReportNotice'))}</p>` : ''}</div>`;

    'medicine-time'() {

      return layout(`${stepper(2)}${intro(c.title,c.subtitle)}<section class="card stack" style="gap:18px;margin-top:22px"><div><div class="kicker">${esc(t('medicineName'))}</div><strong style="font-size:23px;line-height:1.5;display:block;margin-top:6px">${esc(medicine().name)}</strong></div><div class="divider"></div><div><div class="kicker">${esc(t('labelTiming'))}</div><strong style="font-size:23px;display:block;margin-top:6px">${esc(medicine().timingLabel)}</strong></div><div class="divider"></div><div class="row" style="justify-content:space-between;gap:16px"><span style="font-size:20px">${esc(c.mealTimeLabel)}</span><strong style="font-size:26px">07:00</strong></div></section><section class="hero" style="margin-top:18px;text-align:center"><div class="kicker">${esc(c.previewLabel)}</div><div class="row" style="justify-content:center;gap:14px;margin:12px 0">${icon('bell',30)}<strong style="font-size:44px;line-height:1.5">07:00</strong></div><div style="font-size:21px">${choose('มื้อเช้า','Breakfast')}</div></section><p class="subtitle" style="margin:18px 0">${esc(c.note)}</p><div class="stack" style="gap:12px">${button(c.primary,'saved','primary','check')}${button(c.secondary,'draft','secondary','chevron-left')}</div>`, 'caregiver','','draft',{noNav:true});
    },
    saved() { return successScreen('saved'); },
    'caregiver-settings'() { return settings('caregiver'); },
    'caregiver-unpair'() { return unpair('caregiver',options.confirmStep === 2); }
  };

  function overlappingMealsView() {
    const c = copy().states.overlappingMeals[lang];
    const fixture = copy().sourceData.overlappingFixture;
    const confirmations = options.forcedOverlapConfirmed || runtime().overlapConfirmed || {};
    const hasConfirmation = id => Array.isArray(confirmations) ? confirmations.includes(id) : !!confirmations[id];
    const count = fixture.meals.filter(meal => hasConfirmation(meal.id)).length;
    const meals = fixture.meals.map(meal => {
      const done = hasConfirmation(meal.id);
      const late = meal.id === 'A';
      const stateClass = done ? 'status-success' : late ? 'status-danger' : 'status-due';
      const label = done ? `${late ? t('late') : t('taken')} · 07:00` : late ? t('unconfirmed') : t('due');
      const controls = done ? '' : `<div class="stack" style="gap:10px">${button(c.primary,null,'primary','check',{'data-confirm-meal':meal.id,'data-overlap-meal':meal.id,'data-confirm-late':late ? 'true' : 'false',style:'min-height:64px;font-size:22px'})}${button(c.secondary,null,'danger','clock',{'data-not-yet':meal.id,'data-overlap-meal':meal.id,style:'min-height:64px;font-size:22px'})}</div>`;
      return `<section class="meal-card ${stateClass}" data-overlap-card="${meal.id}" style="padding:18px;display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between;gap:10px;align-items:flex-start"><h2 style="font-size:22px;line-height:1.5;margin:0;min-width:0">${esc(c.mealHeading)} ${meal.id} · ${meal.time}</h2>${pill(label,stateClass,done ? 'check-circle' : late ? 'alert-circle' : 'clock')}</div><div class="row" style="gap:14px;align-items:center"><strong style="font-size:26px;line-height:1.5">${esc(meal.name)}</strong><p style="font-size:18px;line-height:1.6;margin:0">${esc(meal.displayDose)} · ${esc(meal.timingLabel)}</p></div>${controls}${done ? `<p class="subtitle" style="margin:0">${choose('ยืนยันเวลา','Confirmed at')} 07:00</p>` : ''}</section>`;
    }).join('');
    return layout(`<div class="stack" style="gap:14px" data-shared-reminder-sound="once"><div class="kicker">${esc(c.specimenLabel)}</div>${intro(count === 2 ? c.allConfirmed : c.title,c.body)}<div class="row" style="justify-content:space-between;gap:10px">${pill(`${count}/2 ${choose('ยืนยัน','confirmed')}`,count === 2 ? 'status-success' : '','check-circle')}<span class="pill" aria-label="${esc(c.soundNotice)}">${icon('bell',18)}<span>${choose('เสียงเตือนครั้งเดียว','One reminder sound')}</span></span></div>${meals}<p class="subtitle" style="margin:0">${esc(t('selfReportNotice'))}</p><p class="subtitle" style="margin:0">${esc(t('medicalNotice'))}</p></div>`, 'senior','','senior-home',{noNav:true,noTop:true,mainAttrs:{'data-overlap-state':'BR-16'}});
  }

  function beforeFoodMinutesMissingView() {
    const c = copy().states.beforeFoodMinutesMissing[lang];
    const fixture = copy().sourceData.beforeFoodMinutesMissingFixture;
    return layout(`${stepper(2)}${intro(c.title,c.body)}<section class="card stack" style="gap:18px;margin-top:20px"><div><div class="kicker">${esc(t('medicineName'))}</div><strong style="display:block;font-size:26px;line-height:1.5;margin-top:6px">${esc(fixture.name)}</strong><p class="subtitle" style="margin:6px 0 0">${esc(fixture.displayDose)} · ${esc(fixture.timingLabel)}</p></div><div class="divider"></div>${field(c.fieldLabel,'',{id:'medicine-minutes-before',required:true,type:'number',error:true,attrs:{'data-review-field':'minutesBefore','data-before-minutes':'',min:'1'}})}<p class="subtitle" style="margin:0">${esc(c.fieldHint)}</p></section><section class="notice notice-amber" style="margin-top:18px">${icon('clock',24)}<div><strong style="display:block;font-size:20px">${esc(c.timeLabel)}</strong><p style="margin:6px 0 0;font-size:20px;line-height:1.5" data-time-preview>${esc(c.timeMissing)}</p></div></section><div class="stack" style="gap:12px;margin-top:20px">${button(c.primary,'saved','primary','check',{'data-review-next':'',disabled:''})}${button(c.secondary,'draft','secondary','chevron-left')}</div><p class="subtitle" style="margin-top:16px">${esc(t('sourceUntranslated'))}</p>`, 'caregiver','','draft',{noNav:true});
  }

  function connectionOrSoundState(stateKey, role) {
    const c = copy().states[stateKey][lang];
    const isSound = stateKey === 'soundNotReady' || stateKey === 'soundUnavailable';
    if (isSound) {
      return layout(`<div class="stack" style="gap:22px;padding-top:22px"><div class="success-mark status-amber" style="align-self:flex-start">${icon('volume-2',38)}</div>${intro(c.title,c.body)}<div class="card stack" style="gap:14px">${button(c.primary,null,'primary','volume-2',{'data-sound':'enable'})}${button(c.secondary,null,'secondary','bell',{'data-sound':'test'})}</div>${notice(c.note,'','info')}${privacy()}</div>`,role,screenKey);
    }
    if (stateKey === 'accessRevoked') {
      return layout(`<div class="stack" style="gap:22px;padding-top:28px"><div class="success-mark status-amber" style="align-self:flex-start">${icon('users',38)}</div>${intro(c.title,c.body)}${pill(c.status,'status-amber','log-out')}<div style="padding-top:12px">${button(role === 'caregiver' ? c.caregiverPrimary : c.seniorPrimary,null,'primary',role === 'caregiver' ? 'users' : 'qr-code',{'data-reconnect':role})}</div>${privacy()}</div>`,role,'','',{noNav:true});
    }
    return layout(`<div class="stack" style="gap:22px;padding-top:24px"><div class="success-mark status-amber" style="align-self:flex-start">${icon('alert-circle',38)}</div>${intro(c.title,c.body)}<div class="card">${pill(c.status,'status-success','users')}</div><div class="stack" style="gap:12px">${button(c.primary,null,'primary','refresh-cw',{'data-unpair-retry':role})}${button(c.secondary,`${role}-settings`,'secondary','settings')}</div>${privacy()}</div>`,role,'',`${role}-settings`,{noNav:true});
  }

  function stateView(stateKey, role = 'senior') {
    const state = copy().states[stateKey];
    if (!state) return views[screenKey]();
    if (stateKey === 'overlappingMeals') return overlappingMealsView();
    if (['overlappingMealAConfirmed','overlappingMealBConfirmed','overlappingMealsAllConfirmed'].includes(stateKey)) {
      options.forcedOverlapConfirmed = stateKey === 'overlappingMealAConfirmed' ? {A:true} : stateKey === 'overlappingMealBConfirmed' ? {B:true} : {A:true,B:true};
      return overlappingMealsView();
    }
    if (stateKey === 'beforeFoodMinutesMissing') return beforeFoodMinutesMissingView();
    if (['soundNotReady','soundUnavailable','accessRevoked','unpairFailure'].includes(stateKey)) return connectionOrSoundState(stateKey,role);
    if (stateKey === 'roundThreeEscalated') {
      options.forcedStatus = 'danger';
      options.escalated = true;
      if (screenKey === 'notifications') return views.notifications();
      screenKey = 'caregiver-status';
      return views['caregiver-status']();
    }
    if (stateKey === 'unpairConfirmSenior' || stateKey === 'unpairConfirmCaregiver') {
      const unpairRole = stateKey === 'unpairConfirmCaregiver' ? 'caregiver' : 'senior';
      screenKey = `${unpairRole}-unpair`;
      return unpair(unpairRole,true);
    }
    const reminderStates = {reminderRoundOne:1,reminderRoundTwo:2,reminderRoundThree:3};
    if (reminderStates[stateKey]) {
      screenKey = 'reminder';
      options.round = reminderStates[stateKey];
      options.forcedStatus = 'due';
      return views.reminder();
    }
    if (['ocrUncertain','requiredLabelField'].includes(stateKey)) {
      screenKey = 'draft';
      options.uncertain = true;
      options.requiredReview = true;
      return views.draft();
    }
    if (['allConfirmed','lateConfirmed','tPlus15','lateWindowClosed'].includes(stateKey)) {
      options.forcedStatus = {allConfirmed:'success',lateConfirmed:'late',tPlus15:'danger',lateWindowClosed:'closed'}[stateKey];
      if (stateKey === 'lateConfirmed') options.confirmedAt = '07:17';
      if (screenKey === 'notifications') return views.notifications();
      screenKey = role === 'caregiver' ? 'caregiver-status' : 'senior-home';
      return views[screenKey]();
    }
    const c = state[lang];
    const isError = /Error|Failed|Invalid|Expired|Used|Denied|Unavailable|Required|Unsupported|unsupported|offline|loadError/i.test(stateKey);
    const isSuccess = /Confirmed|unpaired|lateConfirmed/i.test(stateKey);
    const isEmpty = /^empty/.test(stateKey);
    const isLoading = /loading|Connecting|Opening|saving/.test(stateKey);
    const type = isError ? (stateKey === 'offline' ? 'amber' : 'danger') : isSuccess ? 'success' : 'amber';
    const symbol = stateKey === 'offline' ? 'wifi-off' : /camera/.test(stateKey) ? 'camera' : isSuccess ? 'check-circle' : isLoading ? 'refresh-cw' : isEmpty ? 'calendar' : 'alert-circle';
    const go = stateKey === 'unpaired' ? 'role' : /^pair/.test(stateKey) ? (role === 'caregiver' ? 'caregiver-pair' : 'senior-pair') : /^ocr|^requiredLabel|^invalidImage|^unsupported/.test(stateKey) ? 'photo-guide' : role === 'caregiver' ? 'caregiver-status' : 'senior-home';
    return layout(`<div class="stack" style="align-items:center;text-align:center;gap:24px;padding-top:28px">${isEmpty ? `<div class="mascot-wrap">${mascot('encourage',156)}</div>` : `<div class="success-mark status-${type}${isLoading ? ' loader' : ''}">${icon(symbol,44)}</div>`}${intro(c.title || c.label,c.body || '')}${c.fieldMessage ? notice(c.fieldMessage,'amber','alert-circle') : ''}${c.mascot ? `<p class="subtitle" style="font-size:20px">${esc(c.mascot)}</p>` : ''}${/^reminderRound|^tPlus15|^lateConfirmed/.test(stateKey) ? `<div style="width:100%;text-align:left">${mealCard(stateKey === 'lateConfirmed' ? 'late' : stateKey === 'tPlus15' ? 'danger' : 'due',false)}</div>` : ''}<div class="stack" style="width:100%;gap:12px">${c.primary ? button(c.primary,go,isError ? 'primary' : 'primary',isError ? 'refresh-cw' : 'arrow-right') : ''}${c.secondary ? button(c.secondary,/Camera|camera/.test(stateKey) ? 'manual' : 'manual','secondary','edit-3') : ''}${c.pairingAlternative && role === 'caregiver' ? button(c.pairingAlternative,'caregiver-pair','secondary','qr-code') : ''}</div>${stateKey === 'offline' && c.status ? notice(c.status,'amber','info') : ''}${privacy()}</div>`,role,'',go,{noNav:true});
  }

  window.MMViews = {
    keys: KEYS,
    render(key, locale = 'th', state = {}) {
      if (!window.MMCopy || !window.MMCopy.screens) throw new Error('Load medmind-copy.json as window.MMCopy before rendering MedMind views.');
      screenKey = KEYS.includes(key) ? key : 'splash';
      lang = locale === 'en' ? 'en' : 'th';
      options = typeof state === 'object' && state ? state : {};
      const stateKey = typeof state === 'string' ? state : options.key || options.stateKey;
      if (stateKey && copy().states[stateKey]) return stateView(stateKey,options.role || (screenKey.startsWith('caregiver') || ['medicines','notifications','medicine-edit','photo-guide','camera','ocr-reading','draft','manual','medicine-time','saved','meal-setup'].includes(screenKey) ? 'caregiver' : 'senior'));
      return views[screenKey]();
    }
  };
})();
</script>

</style>
<script src="js/logic/reminder.js"></script>
<script src="js/logic/confirm.js"></script>
<script src="js/features/reminder.js"></script>
<script>(function(){
  const $=(s)=>document.querySelector(s);
  const params=new URLSearchParams(location.search || '?screen=splash&review=1');
  const D=window.MMCopy;
  const allKeys=D.screens.map(x=>x.key);
  const onset=['splash','role','senior-pair','caregiver-pair','senior-connected','caregiver-connected','meal-setup'];
  const senior=['senior-home','reminder','confirmed','duplicate','senior-settings','senior-unpair'];
  const caregiver=allKeys.filter(k=>!onset.includes(k)&&!senior.includes(k));
  const roleFor=k=>(caregiver.includes(k)||k==='caregiver-pair'||k==='caregiver-connected'||k==='meal-setup')?'caregiver':'senior';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons=window.MMIcon;
  const variables={Light:{bg:'#F5F7F2',surface:'#FFFEF8','surface-raised':'#EDF2E8',primary:'#164C3B','on-primary':'#FFFEF8',text:'#18382F',muted:'#54675D',border:'#D8E1D4',accent:'#D8F36A',success:'#1F653E','success-bg':'#EDF5E9',danger:'#9B352B','danger-bg':'#FCEAE5',amber:'#785012','amber-bg':'#FFF1D8',hero:'#A6C978'},Dark:{bg:'#111A16',surface:'#1A2922','surface-raised':'#22372B',primary:'#CBEA69','on-primary':'#14291D',text:'#E5EEE8',muted:'#BDCCC2',border:'#405248',accent:'#CBEA69',success:'#6FCF97','success-bg':'#203B2C',danger:'#FF8A80','danger-bg':'#3B2925',amber:'#FFC266','amber-bg':'#3A3021',hero:'#354C2A'}};
  window.MMTokens=variables;
  let runtime={key:params.get('screen')||'senior-home',locale:params.get('locale')||'th',theme:params.get('theme')||'Light',state:params.get('state')||'',role:'senior',round:1,confirmed:false,late:false,consent:false,invite:'406218',size:18,sound:false,reading:false,disconnected:false,unpairStep:1,phase:'',alerted:false,confirmedAt:'',overlapConfirmed:{},soundError:false};
  window.MMRuntime=runtime;
  /* FR-03/FR-04: สถานะ "กินแล้ว/ช้า/รอบเตือน/ยังไม่ยืนยัน" มาจาก confirm.js + reminder.js ผ่าน features/reminder.js เท่านั้น */
  const F=window.MedMind.features.reminder;
  const fmt=window.MedMind.reminder.formatTime;
  function syncFromLogic(){
    const s=F.snapshot();
    const notified=s.log.some(e=>e.kind==='unconfirmed');
    Object.assign(runtime,{confirmed:s.confirmed,late:s.late,confirmedAt:s.confirmedAt,round:s.round,unconfirmed:s.unconfirmed,lateWindowClosed:s.lateWindowClosed,alerted:notified,phase:s.confirmed?(notified?'escalated':''):s.unconfirmed?'late':s.escalated?'escalated':''});
    return s;
  }
  function clockBar(locale){
    const s=F.snapshot();const th=locale==='th';
    const round=s.now<F.meals()[0].time?(th?'ยังไม่ถึงเวลา':'Before T'):s.code==='unconfirmed'?(th?'เลย T+15':'Past T+15'):s.confirmed?(th?'ยืนยันแล้ว':'Confirmed'):(th?'รอบเตือน ':'Round ')+s.round;
    return `<div class="demo-clock-bar" data-demo-clock aria-label="${th?'นาฬิกาจำลอง':'Simulated clock'}"><div class="clock">${th?'เวลาจำลอง':'Demo time'} ${s.nowText}<small>${round}</small></div><button type="button" data-tick="1">+1 ${th?'นาที':'min'}</button><button type="button" data-tick="5">+5 ${th?'นาที':'min'}</button><div class="sound-note">${th?'แตะหน้าจอ 1 ครั้งเพื่อเปิดเสียงเตือน':'Tap the screen once to enable sound'}</div></div>`;
  }
  const overlapStates=['overlappingMeals','overlappingMealAConfirmed','overlappingMealBConfirmed','overlappingMealsAllConfirmed'];
  function coverage(key){const ss=D.screens.find(s=>s.key===key);const ids=(ss?.covers||['FR-01']).filter(x=>x.startsWith('FR-'));return 'Covers: '+[...new Set(ids)].join(' · ')}
  function toolbar(locale,role){const t=D.shared[locale];return `<div class="demo-toolbar" aria-label="${locale==='th'?'แถบเดโม':'Demo controls'}"><button data-demo-role="senior" class="${role==='senior'?'active':''}">${icons('user',18)}${locale==='th'?'ผู้สูงอายุ':'Senior'}</button><button data-demo-role="caregiver" class="${role==='caregiver'?'active':''}">${icons('users',18)}${locale==='th'?'ผู้ดูแล':'Caregiver'}</button><button class="reset" data-reset>${icons('refresh-cw',18)}Reset</button></div>`}
  function phone(key,locale,theme,state='',mode='fixed'){
    const isSplash=key==='splash'&&!state;
    const opt={key:state||undefined,theme:theme.toLowerCase(),confirmStep:runtime.unpairStep,role:roleFor(key)};
    return `<div class="phone ${isSplash?'splash':''} ${key==='reminder'?'reminder-screen':''}" data-theme="${theme}" data-key="${key}" data-locale="${locale}" data-state="${esc(state)}"><div class="covers-tag">${coverage(key)}</div>${window.MMViews.render(key,locale,opt)}</div>`;
  }
  function desktop(key,locale,theme,state=''){
    const role=roleFor(key);
    return `<div class="desktop-artboard ${theme==='Dark'?'dark':''}" data-theme="${theme}">${toolbar(locale,role)}${phone(key,locale,theme,state)}<div class="demo-caption"><strong>MedMind</strong>${locale==='th'?'ดูแลมื้อยาอย่างอุ่นใจ':'A calmer way to take medicine'}<br>${locale==='th'?'ต้นแบบสำหรับทดสอบการใช้งาน':'Usability test prototype'} · ${locale==='th'?'ข้อมูลจำลอง':'Fictional data'}</div></div>`;
  }
  window.MMRenderPhone=phone;window.MMRenderDesktop=desktop;
  function artboard(key,locale,theme,view,state=''){
    const title=D.screens.find(s=>s.key===key)?.[locale]?.title?.replace('{{seniorName}}',locale==='th'?'คุณสมพร':'Somphon')||key;
    return `<div class="artboard" data-scene-key="${key}" data-scene-locale="${locale}" data-scene-theme="${theme}" data-scene-viewport="${view}" data-scene-state="${esc(state)}"><div class="design-label"><span>${esc(key)} ${state?' / '+esc(state):''} · ${locale.toUpperCase()}</span><span>${view} / ${theme} · ${coverage(key)}</span></div>${view==='Desktop'?desktop(key,locale,theme,state):phone(key,locale,theme,state)}</div>`;
  }
  const header=(tag,title,sub)=>`<div class="atlas-heading"><div class="eyebrow">MEDMIND / ${tag}</div><h1>${title}</h1><p>${sub}</p></div>`;
  const labelStateKeys=()=>Object.keys(D.states);
  const stateMap=(sk)=>{
    if(sk==='beforeFoodMinutesMissing')return 'medicine-time';
    if(sk==='soundNotReady'||sk==='soundUnavailable')return 'senior-settings';
    if(sk==='accessRevoked')return 'caregiver-pair';
    if(sk==='unpairFailure')return 'caregiver-unpair';
    if(sk==='roundThreeEscalated')return 'notifications';
    if(sk==='requiredLabelField')return 'draft';
    if(sk==='invalidImage')return 'camera';
    if(sk==='confirmationSaveError')return 'senior-home';
    if(sk==='pairConsentRequired')return 'caregiver-pair';
    if(sk==='unpairConfirmSenior')return 'senior-unpair';
    if(sk==='unpairConfirmCaregiver')return 'caregiver-unpair';
    if(sk==='emptyNotifications'||sk==='tPlus15')return 'notifications';
    if(sk==='emptyMedicines'||sk==='emptySearch')return 'medicines';
    if(/pair|code|consent|cameraDeniedQr|connection|accessRevoked/i.test(sk))return /senior|consent/i.test(sk)?'senior-pair':'caregiver-pair';
    if(/camera|scan|ocr|unsupported|draft|missing|before|save|medicine/i.test(sk))return /camera/i.test(sk)?'camera':'draft';
    if(/notify|caregiver|alert|t15/i.test(sk))return 'notifications';
    if(/repeat|round|overlap/i.test(sk))return 'reminder';
    return 'senior-home';
  };
  const stateTargets=(sk)=>({beforeFoodMinutesMissing:['medicine-time'],soundNotReady:['senior-home','senior-settings'],soundUnavailable:['senior-home','senior-settings'],accessRevoked:['senior-pair','caregiver-pair'],unpairFailure:['senior-unpair','caregiver-unpair'],roundThreeEscalated:['notifications','caregiver-status'],tPlus15:['senior-home','caregiver-status','notifications'],lateConfirmed:['senior-home','caregiver-status','notifications'],allConfirmed:['senior-home','caregiver-status'],lateWindowClosed:['senior-home','caregiver-status'],emptyToday:['senior-home','caregiver-status'],offline:['senior-home','caregiver-status'],loadError:['senior-home','caregiver-status'],loading:['senior-home','caregiver-status'],unpaired:['senior-pair','caregiver-pair']}[sk]||[stateMap(sk)]);
  function renderAtlas(){
    document.body.className='atlas-mode';
    const page=params.get('page')||'Cover';
    document.body.dataset.page=page;
    if(page==='Cover'){document.title='Cover';$('#root').innerHTML=renderCover();return;}
    if(page==='Design System'){document.title='Design System';$('#root').innerHTML=renderDS();$('.atlas').insertAdjacentHTML('beforeend',renderComponentSpecimens());return;}
    if(page==='Prototype'){document.title='Prototype';$('#root').innerHTML=renderPrototype();return;}
    let keys=page==='Onboarding'?onset:page==='ผู้สูงอายุ'?senior:page==='ผู้ดูแล'?caregiver:allKeys;
    let views=page==='Desktop'?['Desktop']:page==='Dark Mode'?['Mobile','Desktop']:['Mobile'];
    let themes=page==='Dark Mode'?['Dark']:['Light'];

  function go(key,state=''){
    if(state==='accessRevoked'){runtime.disconnected=true;runtime.confirmed=false;runtime.consent=false;runtime.phase='';runtime.alerted=false;runtime.late=false;runtime.confirmedAt='';runtime.overlapConfirmed={};}
    if(state==='unpairFailure')runtime.disconnected=false;
    if(['senior-connected','caregiver-connected'].includes(key))runtime.disconnected=false;
    if(runtime.disconnected&&!['splash','role','senior-pair','caregiver-pair'].includes(key)){key=roleFor(key)==='caregiver'?'caregiver-pair':'senior-pair';state='accessRevoked';}
    if(!state&&runtime.phase==='late'&&!runtime.confirmed&&['senior-home','caregiver-status'].includes(key))state='tPlus15';
    if(!state&&runtime.phase==='escalated'&&!runtime.confirmed&&['caregiver-status','notifications'].includes(key))state='roundThreeEscalated';
    runtime.key=key;runtime.state=state;history.replaceState({},'',`?screen=${key}&locale=${runtime.locale}&theme=${runtime.theme}${params.has('review')?'&review=1':''}`);renderPreview();
  }
  window.MMGo=go;
  function bind(){
    if(runtime.state==='accessRevoked'){runtime.disconnected=true;runtime.confirmed=false;runtime.consent=false;runtime.phase='';runtime.alerted=false;runtime.late=false;runtime.confirmedAt='';runtime.overlapConfirmed={};}
    if(runtime.state==='unpairFailure')runtime.disconnected=false;
    if(runtime.state==='overlappingMealAConfirmed')runtime.overlapConfirmed={...runtime.overlapConfirmed,A:true};
    if(runtime.state==='overlappingMealBConfirmed')runtime.overlapConfirmed={...runtime.overlapConfirmed,B:true};
    if(runtime.state==='overlappingMealsAllConfirmed')runtime.overlapConfirmed={A:true,B:true};
    document.querySelectorAll('[data-go], [data-confirm-meal][data-overlap-meal]').forEach(b=>b.addEventListener('click',()=>{
      if(b.disabled)return;
      const k=b.dataset.go;
      const overlapId=b.dataset.confirmMeal;
      if(overlapStates.includes(runtime.state)&&['A','B'].includes(overlapId)){runtime.overlapConfirmed=runtime.overlapConfirmed||{};if(runtime.overlapConfirmed[overlapId])return;runtime.overlapConfirmed[overlapId]=true;runtime.state=runtime.overlapConfirmed.A&&runtime.overlapConfirmed.B?'overlappingMealsAllConfirmed':runtime.overlapConfirmed.A?'overlappingMealAConfirmed':'overlappingMealBConfirmed';renderPreview();toast(runtime.locale==='th'?'บันทึกการยืนยันมื้อ '+overlapId+' แล้ว':'Dose '+overlapId+' confirmation saved');return;}
      if(b.matches('input[type=checkbox]')){runtime.consent=b.checked;if(!runtime.consent)return;}
      if(k==='medicine-time'||k==='saved'){
        const required=Array.from(document.querySelectorAll('.phone input[required]'));
        const missing=required.filter(n=>!n.value.trim()||(+n.value<=0&&n.type==='number'));
        if(missing.length){missing.forEach(n=>n.closest('.field').classList.add('field-error'));missing[0].focus();toast(runtime.locale==='th'?'กรุณาตรวจสอบช่องที่จำเป็น':'Please check the required fields');return;}
      }
      if(k==='confirmed'){
        const r=F.confirmTaken(); /* confirm.confirmMeal: 1 แตะ = ทั้งมื้อ, กดซ้ำ = duplicate (NFR-07), ช้าได้ถึงมื้อถัดไป (BR-15) */
        if(!r.ok){toast(runtime.locale==='th'?(r.reason==='not_due'?'ยังไม่ถึงเวลามื้อยา':'ปิดช่วงยืนยันมื้อนี้แล้ว'):(r.reason==='not_due'?'Not time for this dose yet':'The confirmation window has closed'));return;}
        if(r.duplicate){go('duplicate');return;}
      }
      if(k==='caregiver-connected'&&!runtime.consent){go('caregiver-pair','pairConsentRequired');return;}
      go(k);
    }));
    document.querySelectorAll('[data-demo-role]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.demoRole==='senior'?'senior-home':'caregiver-status')));
    $('[data-reset]')?.addEventListener('click',()=>{F.reset();Object.assign(runtime,{confirmed:false,late:false,consent:false,round:1,state:'',phase:'',unpairStep:1,overlapConfirmed:{},alerted:false,confirmedAt:'',disconnected:false,sound:false,soundError:false});go('splash')});
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{runtime.locale=b.dataset.lang;renderPreview()}));
    document.querySelectorAll('[data-locale]').forEach(b=>b.addEventListener('click',()=>{runtime.locale=b.dataset.locale|| (runtime.locale==='th'?'en':'th');renderPreview()}));
    document.querySelectorAll('[data-theme]').forEach(b=>{if(b.tagName==='BUTTON')b.addEventListener('click',()=>{const v=b.dataset.theme.toLowerCase();runtime.theme=v==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'Dark':'Light'):v==='dark'?'Dark':'Light';runtime.themeChoice=v;renderPreview()})});
    $('[data-theme-toggle]')?.addEventListener('click',()=>{runtime.theme=runtime.theme==='Light'?'Dark':'Light';renderPreview()});
    $('[data-screen-picker]')?.addEventListener('change',e=>go(e.target.value));
    document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{runtime.size=+b.dataset.size;renderPreview();toast(runtime.locale==='th'?'ปรับขนาดตัวอักษรแล้ว':'Text size updated')}));
    document.querySelectorAll('[data-font-size]').forEach(b=>b.addEventListener('click',()=>{runtime.size=[18,21,24,27][+b.dataset.fontSize]||18;renderPreview();toast(runtime.locale==='th'?'ปรับขนาดตัวอักษรแล้ว':'Text size updated')}));
    document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',async()=>{
      try{
        const A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Audio unavailable');
        const a=new A();if(a.resume)await a.resume();if(a.state&&a.state!=='running')throw new Error('Audio is not ready');
        const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=523.25;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);o.connect(g);g.connect(a.destination);o.onended=()=>{if(a.close)a.close();};o.start();o.stop(a.currentTime+.5);
        runtime.sound=true;runtime.soundError=false;
        if(['soundNotReady','soundUnavailable'].includes(runtime.state))go(runtime.key);
        toast(runtime.locale==='th'?'เปิดใช้งานเสียงเตือนแล้ว':'Reminder sound is ready');
      }catch{runtime.sound=false;runtime.soundError=true;go(runtime.key,'soundUnavailable');}
    }));
    $('[data-consent]')?.addEventListener('click',e=>{
      e.preventDefault();
      const scrollTop=$('.screen-scroll')?.scrollTop||0;
      runtime.consent=!runtime.consent;
      renderPreview();
      const scroll=$('.screen-scroll');if(scroll)scroll.scrollTop=scrollTop;
      $('[data-consent]')?.focus({preventScroll:true});
    });
    $('[data-pair-senior]')?.addEventListener('click',()=>{if(runtime.consent)go('senior-connected')});
    $('[data-new-code]')?.addEventListener('click',()=>{runtime.invite=''+Math.floor(100000+Math.random()*900000);renderPreview();toast(runtime.locale==='th'?'สร้างรหัสใหม่แล้ว ใช้ได้ 10 นาที':'New code is ready for 10 minutes')});
    $('[data-pair-code]')?.addEventListener('click',()=>{const n=$('[data-invite-input]');if(n&&n.value.replace(/\s/g,'')!==runtime.invite){go('caregiver-pair','pairCodeInvalid');return;}if(!runtime.consent){go('caregiver-pair','pairConsentRequired');return;}go('caregiver-connected')});
    $('[data-action="scan-qr"]')?.addEventListener('click',()=>{if(!runtime.consent){go('caregiver-pair','pairConsentRequired');return;}go('caregiver-connected')});
    document.querySelectorAll('[data-not-yet]').forEach(b=>b.addEventListener('click',()=>{
      const th=runtime.locale==='th';
      if(overlapStates.includes(runtime.state)){toast(th?'มื้อนี้ยังไม่ยืนยัน':'This dose is still unconfirmed');return;}
      const r=F.notYet(); /* confirm.pressNotYet: รอบ 1–2 รอรอบถัดไป, รอบ 3 แจ้ง Caregiver ทันที (BR-11) */
      if(!r.ok){toast(th?'ตอนนี้กดไม่ได้':'Not available right now');return;}
      if(r.action==='notify_caregiver'){go('notifications','roundThreeEscalated');return;}
      toast(th?'จะเตือนอีกครั้งเวลา '+fmt(r.nextAt):'Next reminder at '+fmt(r.nextAt));
      go('senior-home','notYetRecorded');
    }));
    document.querySelectorAll('[data-tick]').forEach(b=>b.addEventListener('click',()=>{
      const th=runtime.locale==='th';
      const res=F.advance(+b.dataset.tick); /* reminder.dueReminders: เตือนที่ T, T+5, T+10 ทั้งมื้อ + เสียงครั้งเดียว (BR-08/09/16) */
      if(res.due.firing.length&&roleFor(runtime.key)==='senior'){
        toast((th?'ถึงเวลาเตือนรอบ ':'Reminder round ')+res.due.firing[0].round+(res.soundPlayed?' 🔔':''));
        go('reminder');return;
      }
      go(runtime.key,runtime.state);
    }));
    $('[data-next-round]')?.addEventListener('click',()=>go('reminder'));
    $('[data-reading]')?.addEventListener('click',()=>{go('ocr-reading');setTimeout(()=>{if(runtime.key==='ocr-reading')go('draft')},1600)});
    $('[data-disconnect]')?.addEventListener('click',()=>{if(runtime.unpairStep===1){runtime.unpairStep=2;renderPreview();return;}runtime.disconnected=true;runtime.confirmed=false;runtime.consent=false;runtime.phase='';runtime.alerted=false;runtime.late=false;runtime.confirmedAt='';runtime.overlapConfirmed={};runtime.round=1;runtime.invite=''+Math.floor(100000+Math.random()*900000);runtime.unpairStep=1;go(runtime.role==='senior'?'senior-pair':'caregiver-pair')});
    $('[data-unpair-retry]')?.addEventListener('click',()=>{runtime.unpairStep=1;runtime.disconnected=false;go(runtime.role==='senior'?'senior-unpair':'caregiver-unpair')});
    $('[data-reconnect]')?.addEventListener('click',()=>{runtime.consent=false;runtime.invite=''+Math.floor(100000+Math.random()*900000);go(runtime.role==='senior'?'senior-pair':'caregiver-pair')});
    document.querySelectorAll('[data-review-field]').forEach(n=>n.addEventListener('input',()=>{const ready=Array.from(document.querySelectorAll('[data-review-field]')).every(x=>x.value.trim()&&(x.type!=='number'||Number(x.value)>0));const next=$('[data-review-next]');if(next)next.disabled=!ready;}));
    document.querySelectorAll('[data-state]').forEach(b=>{if(b.tagName==='BUTTON')b.addEventListener('click',()=>{go(runtime.key,b.dataset.state)})});
    const auto=$('[data-auto-go]');if(auto&&!params.has('atlas'))setTimeout(()=>{if(runtime.key==='ocr-reading')go(auto.dataset.autoGo)},+auto.dataset.autoDelay||2200);
    if(runtime.size>18){const ratio=runtime.size/18;const changes=[];document.querySelectorAll('.phone h1,.phone h2,.phone h3,.phone p,.phone span,.phone strong,.phone label,.phone input,.phone textarea,.phone button').forEach(el=>{const computed=getComputedStyle(el);if(el.closest('svg')||el.classList.contains('covers-tag'))return;changes.push([el,parseFloat(computed.fontSize)*ratio])});for(const [el,size]of changes){el.style.fontSize=size+'px';el.style.lineHeight='1.55'}}
    $('[data-states]')?.addEventListener('click',()=>{const sks=labelStateKeys();const current=sks.indexOf(runtime.state);runtime.state=sks[(current+1)%sks.length];renderPreview()});
    // Forms are UI prototypes: they validate required fields without inventing OCR data.
    document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();if(f.reportValidity())go(f.dataset.next||'medicine-time')}));
  }
  if(params.has('atlas')){renderAtlas();if(params.has('fit'))$('#root').style.zoom=params.get('fit')||'.45';}else renderPreview();
})();
</script></body></html>
