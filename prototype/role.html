<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>MedMind — เลือกบทบาท</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/role.css">
</head>
<body>
  <!-- หน้าแรกของ prototype: เลือกบทบาทก่อนเข้าแอป (YAR OO) · Covers: FR-01 -->
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-pill" viewBox="0 0 24 24"><path d="M10.5 3.5a6 6 0 0 1 8.5 8.5l-7 7a6 6 0 0 1-8.5-8.5zM8 8l8 8"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-4-4M20 16H7l4 4"/></symbol>
  </svg>
  <main class="role-page">
    <header class="role-brand">
      <span class="brand-mark"><span></span></span>
      <span><strong>MedMind</strong><small data-text="tagline">ดูแลมื้อยาอย่างอุ่นใจ</small></span>
    </header>

    <span class="covers-tag">Covers: FR-01</span>
    <h1 data-text="title">คุณใช้ MedMind ในฐานะใคร?</h1>
    <p class="role-lead" data-text="lead">เลือกบทบาทเพื่อเข้าแอป — เปลี่ยนได้ทุกเมื่อจากปุ่ม "เปลี่ยนบทบาท" ด้านบนของแอป</p>

    <div class="role-grid">
      <button class="role-card" type="button" data-role="senior">
        <span class="role-icon"><svg class="icon"><use href="#i-pill"/></svg></span>
        <span class="role-copy">
          <strong>ผู้สูงอายุ (Senior)</strong>
          <span data-text="seniorText">ดูมื้อยาวันนี้ รับการเตือน และกด "กินแล้ว"</span>
          <small>FR-03 · FR-04</small>
        </span>
        <svg class="icon role-go"><use href="#i-arrow"/></svg>
      </button>
      <button class="role-card" type="button" data-role="caregiver">
        <span class="role-icon lime"><svg class="icon"><use href="#i-heart"/></svg></span>
        <span class="role-copy">
          <strong>ลูกหลาน / ผู้ดูแล (Caregiver)</strong>
          <span data-text="caregiverText">สแกนฉลากเพื่อเพิ่มยา และดูสถานะมื้อยาของผู้สูงอายุ</span>
          <small>FR-01 · FR-02 · FR-05</small>
        </span>
        <svg class="icon role-go"><use href="#i-arrow"/></svg>
      </button>
    </div>

    <a class="role-demo-link" href="demo.html"><svg class="icon"><use href="#i-swap"/></svg><span data-text="demo">ดูทั้ง 2 บทบาทพร้อมกัน (สำหรับนำเสนอ)</span></a>
    <p class="role-note" data-text="note">เดโมนี้ไม่มี server — เปิด 2 แท็บในเบราว์เซอร์เดียวกันแล้วเลือกคนละบทบาท = จำลองมือถือ 2 เครื่อง</p>
  </main>

  <script src="js/core/role.js"></script>
  <script src="js/features/roleSelect.js"></script>
</body>
</html>
